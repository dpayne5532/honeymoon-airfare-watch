name: Track fare

on:
  schedule:
    - cron: "23 13 * * *"   # daily, ~7am Mountain
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-fare
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run fetcher tests
        run: cd fetcher && python3 -m unittest -q test_fetch_fare

      - name: Fetch today's fare
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_PRICE: ${{ vars.TARGET_PRICE }}
        run: python3 fetcher/fetch_fare.py

      - name: Commit history
        if: always()
        run: |
          git config user.name "fare-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Fare snapshot $(date -u +%F)"
            git push
          fi
